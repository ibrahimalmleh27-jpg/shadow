<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow Upload</title>

<style>
body {
  background:#111;
  color:#ddd;
  font-family:Arial;
  text-align:center;
}

.container {
  margin-top:100px;
}

.box {
  background:#1b1b1b;
  padding:25px;
  width:300px;
  margin:auto;
  border-radius:8px;
}

h2 {
  margin-bottom:15px;
}

input {
  margin:10px 0;
}

button {
  background:#4ade80;
  border:none;
  padding:10px 20px;
  color:#000;
  cursor:pointer;
  border-radius:5px;
}

a {
  color:#4ade80;
}

.api {
  margin-top:30px;
  font-size:13px;
  color:#aaa;
}

code {
  background:#000;
  padding:8px;
  display:block;
  margin-top:5px;
  word-break:break-all;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="box">
    <h2>📤 Upload File</h2>

    <input type="file" id="file"><br>
    <button onclick="upload()">Upload</button>

    <p id="result"></p>
  </div>

  <div class="api">
    <h3>📡 API Usage</h3>
    POST:
    <code id="apiUrl"></code>
    <button onclick="copyApi()">📋 Copy API</button>
  </div>

</div>

<script>
const api = location.origin + '/api/upload'
document.getElementById('apiUrl').innerText = api

async function upload() {
  const file = document.getElementById('file').files[0]

  if (!file) return alert("اختار ملف")

  const form = new FormData()
  form.append('file', file)

  const res = await fetch('/api/upload', {
    method: 'POST',
    body: form
  })

  const data = await res.json()

  if (data.status) {
    document.getElementById('result').innerHTML = `
      🔗 <a href="${data.url}" target="_blank">${data.url}</a><br><br>
      <button onclick="copy('${data.url}')">📋 Copy Link</button>
    `
  }
}

function copy(text) {
  navigator.clipboard.writeText(text)
  alert("Copied 🔥")
}

function copyApi() {
  navigator.clipboard.writeText(api)
  alert("API Copied 🔥")
}
</script>

</body>
</html>
