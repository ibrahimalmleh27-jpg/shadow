<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow Host</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.box {
  margin-top: 50px;
}

button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<div class="box">
  <h1>🚀 Shadow Host</h1>

  <input type="file" id="file">
  <button onclick="upload()">Upload</button>

  <h3>📂 Files</h3>
  <div id="files"></div>
</div>

<script>
async function upload() {
  const file = document.getElementById('file').files[0]
  const data = new FormData()
  data.append('file', file)

  const res = await fetch('/upload', {
    method: 'POST',
    body: data
  })

  const json = await res.json()
  alert(json.url)

  loadFiles()
}

async function loadFiles() {
  const res = await fetch('/files-list')
  const files = await res.json()

  const div = document.getElementById('files')
  div.innerHTML = ''

  files.forEach(f => {
    div.innerHTML += `
      <p>
        <a href="/files/${f}" target="_blank">${f}</a>
        <button onclick="del('${f}')">❌</button>
      </p>
    `
  })
}

async function del(name) {
  await fetch('/delete/' + name, { method: 'DELETE' })
  loadFiles()
}

loadFiles()
</script>

</body>
</html>
